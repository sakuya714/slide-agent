<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slide-agent</title>
<link rel="stylesheet" href="/editor/app.css">
</head>
<body class="mode-home">

<!-- 上の帯：左＝資料名と保存状態／中央＝編集の道具／右＝確かめる・見せる・書き出す。アイコンは app.js の ICONS から入る -->
<header id="top">
  <div class="top-left">
    <button id="homeBtn" class="brand" title="資料の一覧（⌘O）">slide-agent</button>
    <div class="doc-title doc-only">
      <span id="deckFolder" class="folder"></span>
      <span id="deckName"></span>
      <span id="status" class="status"></span>
    </div>
  </div>

  <div class="tools top-center doc-only">
    <button id="undoBtn" class="icon" data-icon="undo" title="元に戻す（⌘Z）" disabled></button>
    <button id="redoBtn" class="icon" data-icon="redo" title="やり直し（⇧⌘Z）" disabled></button>
    <span class="vsep"></span>
    <button id="textBtn" class="tool has-menu" data-icon="text" title="見出し・本文・箇条書きなどを足す">文字</button>
    <button id="blockBtn" class="tool has-menu" data-icon="card" title="カード・数字などを足す">カード</button>
    <button id="imageBtn" class="tool" data-icon="image" title="画像を足す（ドラッグ・⌘V でも置ける）">画像</button>
    <span class="vsep"></span>
    <button id="viewBtn" class="tool" data-icon="grid" title="スライド一覧で全体を見る・並べ替える（⌘G）">一覧</button>
    <button id="zoomBtn" class="tool zoom has-menu" title="表示の大きさ"><span id="zoomLabel">100%</span></button>
  </div>

  <div class="top-right">
    <div class="tools doc-only">
      <button id="checkBtn" class="tool" title="はみ出し・画像切れ・小さい文字などを調べる">チェック<span id="checkBadge" class="badge" hidden></span></button>
      <button id="presentBtn" class="tool" data-icon="play" title="このスライドから発表（⌘Enter）／最初から（⇧⌘Enter）">発表</button>
      <button id="exportBtn" class="tool primary has-menu">書き出し</button>
      <button id="moreBtn" class="icon" data-icon="more" title="その他"></button>
    </div>
    <div class="tools home-only">
      <input id="homeSearch" type="search" placeholder="資料を探す" autocomplete="off">
      <button id="newDeckBtn" class="tool primary" data-icon="plus">新しい資料</button>
    </div>
  </div>
</header>

<!-- ホーム：資料の一覧 -->
<main id="home">
  <div id="homeBody"></div>
</main>

<!-- 編集画面 -->
<main id="main" hidden>
  <section id="slidesPane" aria-label="スライド">
    <div class="pane-head">
      <span id="slideCount"></span>
      <button id="slideAddBtn" class="icon" data-icon="plus" title="スライドを足す（レイアウトを選ぶ）"></button>
      <button id="slideDupBtn" class="icon" data-icon="copy" title="このスライドを複製（⌘D）"></button>
      <button id="slideDelBtn" class="icon" data-icon="trash" title="このスライドを削除（⌫）"></button>
    </div>
    <div id="thumbs" tabindex="0"></div>
  </section>

  <section id="center">
    <div id="stage"><div id="frameWrap"><iframe id="frame" title="スライド"></iframe></div></div>
    <div id="notesPane">
      <textarea id="notes" placeholder="ノート（話すこと。発表者表示と PPTX のノートに出る）"></textarea>
    </div>
  </section>

  <section id="sorter" aria-label="スライド一覧"></section>

  <section id="inspector" aria-label="書式"></section>
</main>

<!-- 発表 -->
<div id="present" hidden>
  <div class="p-main" id="pMain"><div class="p-box" id="pCurBox"><iframe id="pCur" tabindex="-1"></iframe></div></div>
  <div class="p-side">
    <div class="p-label">次のスライド</div>
    <div class="p-next" id="pNextWrap"><div class="p-box" id="pNextBox"><iframe id="pNext" tabindex="-1"></iframe></div><div class="p-end" id="pEnd">おわり</div></div>
    <div class="p-meta"><span id="pCount"></span><span id="pTimer">00:00</span><span id="pClock"></span></div>
    <div class="p-label">ノート</div>
    <div class="p-notes" id="pNotes"></div>
  </div>
  <div class="p-black" id="pBlack"></div>
  <div class="p-hint" id="pHint">← → で移動 ・ N で発表者表示 ・ B で黒い画面 ・ Esc で終わる</div>
</div>

<dialog id="dlg"></dialog>
<input id="filePick" type="file" accept="image/png,image/jpeg,image/gif,image/webp,image/svg+xml" hidden>
<div id="banner" hidden></div>
<div id="toast"></div>

<script type="module" src="/editor/app.js"></script>
</body>
</html>
